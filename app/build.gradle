plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lancelot.island'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lancelot.island'
        minSdk 30
        targetSdk 34
        versionCode 6
        versionName '0.6'
    }

    // Clave fija (de pruebas) para que cada compilacion se pueda instalar ENCIMA de la anterior
    // sin desinstalar y sin perder la activacion en LSPosed.
    signingConfigs {
        fija {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fija
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // API de Xposed: solo para compilar, en tiempo de ejecucion la pone LSPosed
    compileOnly 'de.robv.android.xposed:api:82'
}
