plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lancelot.island'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lancelot.island'
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la clave debug: suficiente para instalar y activar en LSPosed
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // API de Xposed: solo para compilar, en tiempo de ejecución la pone LSPosed
    compileOnly 'de.robv.android.xposed:api:82'
}
